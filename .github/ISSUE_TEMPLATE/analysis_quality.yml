name: Analysis quality feedback
description: Suggest better scoring, evidence rules, or sport-specific report language.
title: "[Analysis]: "
labels: ["analysis-quality"]
body:
  - type: dropdown
    id: sport
    attributes:
      label: Sport
      options:
        - foil fencing
        - climbing
        - youth fitness
        - cross-sport
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Action template
      placeholder: weighted lunge, lead climb, squat, etc.
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
      description: Describe the report dimension, rubric, phase, or evidence rule.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Suggested source
      description: Add a federation rule, coaching reference, paper, DOI, or expert source if available.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include identifiable child video, faces, names, clubs, schools, or exact locations.
          required: true
